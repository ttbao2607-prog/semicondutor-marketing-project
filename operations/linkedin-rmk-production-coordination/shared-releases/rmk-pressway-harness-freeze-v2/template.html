<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digiwin</title><style>
:root{--ink:#142b49;--body:#24364b;--muted:#475569;--blue:#2563eb;--pale:#eef4fa;--line:#cbd5e1;--orange:#ea580c;--paper:#fff;--motion:160ms}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;background:#f5f8fc;color:var(--body);font:18px/1.7 Arial,'Microsoft YaHei','PingFang SC',sans-serif}a,button,select{touch-action:manipulation}a{color:var(--ink)}a,button{cursor:pointer;transition:color var(--motion),background-color var(--motion)}button,select{font:inherit}a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:4px}[hidden]{display:none!important}.wrap{width:min(1184px,100%);padding:0 40px;margin:auto}.masthead{background:var(--paper);border-bottom:1px solid var(--line)}.masthead .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:24px;padding-bottom:24px}.logo{display:block;width:128px;height:auto}.languages{display:flex;gap:8px;flex-wrap:wrap}.languages button{min-height:44px;padding:8px 13px;font-size:14px;line-height:1.4;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--body);font-weight:700}.languages button:hover{background:var(--pale)}.languages button:active{background:#dbe8f5}.languages button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}.skip{position:absolute;top:-100px;left:16px;background:var(--paper);padding:12px;z-index:2}.skip:focus{top:12px}.notice{padding:12px 16px;border-left:3px solid var(--blue);font-size:16px;background:var(--pale)}.sheet{background:var(--paper);margin:40px auto 56px;padding:44px 48px;box-shadow:0 4px 30px #142b4909}.eyebrow{color:var(--ink);font-weight:700;letter-spacing:.12em;font-size:13px;line-height:1.5;margin:0 0 20px}.summary{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:40px;align-items:start}.summary-text{min-width:0}h1{font-size:clamp(32px,4.5vw,52px);font-weight:700;line-height:1.15;letter-spacing:-.035em;color:var(--ink);margin:0 0 20px;max-width:20ch;overflow-wrap:anywhere}.intro{font-size:20px;line-height:1.6;margin:0;max-width:54ch}.case-facts{border-top:4px solid var(--ink);padding:18px 0 0;min-width:0}.entity{font-size:17px;line-height:1.55;font-weight:600;margin:0;overflow-wrap:anywhere}.market{font-size:16px;color:var(--muted);margin:10px 0 18px}.metric{background:var(--pale);padding:18px 20px;scroll-margin-top:24px}.metric-label{font-size:16px;font-weight:700;margin:0 0 12px}.metric-number{display:flex;align-items:baseline;gap:12px;color:var(--ink);font-size:44px;line-height:1.1;font-weight:700;white-space:nowrap}.arrow{font-weight:400;font-size:24px}.unit{font-size:16px;font-weight:400}.publisher{font-size:16px;color:var(--muted);line-height:1.5;margin:12px 0 0}.article-nav{display:flex;gap:8px 24px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;margin-top:32px}.article-nav a{display:inline-flex;align-items:center;min-height:44px;font-size:16px;text-decoration:none;font-weight:600}.article-nav a:hover{text-decoration:underline;text-underline-offset:5px}.chapter{display:grid;grid-template-columns:64px minmax(0,1fr);gap:24px;padding:36px 0;border-bottom:1px solid var(--line);scroll-margin-top:24px}.chapter-number{font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--ink);line-height:2.4}.chapter-content{min-width:0}h2{font-size:27px;line-height:1.3;letter-spacing:-.015em;color:var(--ink);margin:0 0 20px}.problems{list-style:none;padding:0;margin:0;counter-reset:problem}.problems li{counter-increment:problem;padding:16px 0;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:20px;font-size:20px;line-height:1.5}.problems li:first-child{padding-top:0}.problems li:last-child{border-bottom:0;padding-bottom:0}.problems li:before{content:counter(problem,decimal-leading-zero);font-size:13px;color:var(--muted);font-weight:700}.copy{margin:0;max-width:60ch}.source-step{display:flex;align-items:flex-start;gap:16px;padding:18px 20px;background:var(--pale);margin-bottom:20px}.source-step svg{flex:0 0 24px;margin-top:3px}.source-step p{margin:0}.source-locator{font-size:16px;color:var(--muted);margin:20px 0;overflow-wrap:anywhere}.source-cta{display:inline-flex;align-items:center;gap:14px;min-height:48px;background:var(--orange);color:#000;text-decoration:none;padding:12px 22px;font-size:16px;line-height:1.4;font-weight:700;border-radius:4px}.source-cta:hover{background:#f97316}.source-cta:active{background:#d9510b}.source-cta svg{flex:0 0 20px}.source-bottom{display:flex;flex-wrap:wrap;align-items:center;gap:16px 32px;margin-top:24px;color:var(--muted);font-size:16px}.source-bottom p{margin:0}.locale-select{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.locale-select select{min-height:44px;padding:8px 12px;max-width:100%;border:1px solid var(--line);border-radius:4px;color:var(--body);background:var(--paper);font-size:16px}.footer{font-size:16px;color:var(--muted);padding:0 0 36px}.unavailable{margin:40px 0;background:var(--paper);border-left:4px solid var(--ink);padding:24px}.unavailable h1{font-size:28px}.unavailable p{max-width:60ch}noscript p{padding:20px;font-size:16px;background:var(--paper)}
@media(max-width:760px){body{font-size:17px;line-height:1.7}.wrap{padding:0 20px}.masthead .wrap{align-items:flex-start;flex-direction:column;gap:16px;padding-top:20px;padding-bottom:16px}.logo{width:112px}.languages button{padding:8px 10px}.sheet{margin:24px -20px 32px;box-shadow:none;padding:24px 20px 8px}.eyebrow{margin-bottom:14px;font-size:13px}.summary{display:block}h1{font-size:32px;line-height:1.2;margin-bottom:16px;max-width:22ch}.intro{font-size:17px;line-height:1.65}.case-facts{margin-top:24px;border-top-width:2px;padding-top:16px}.entity{font-size:16px;font-weight:600}.market{margin:8px 0 16px}.metric{padding:16px 20px}.metric-label{margin-bottom:10px}.metric-number{font-size:38px}.publisher{font-size:16px;line-height:1.5;margin-top:12px}.article-nav{margin-top:24px;gap:8px 20px}.chapter{display:block;padding:28px 0}.chapter-number{margin-bottom:8px;line-height:1.5}h2{font-size:24px;line-height:1.35;margin-bottom:18px}.problems li{font-size:18px;gap:16px;padding:16px 0}.source-step{padding:16px;gap:12px;font-size:17px}.source-step svg{width:20px;flex-basis:20px}.source-cta{width:100%;justify-content:center}.source-bottom{gap:16px;margin-top:20px}.footer{padding-bottom:28px;font-size:16px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
@media print{.languages,.skip,.article-nav,.locale-select{display:none}.sheet{margin:0;padding:0;box-shadow:none}.wrap{padding:0}.chapter{break-inside:avoid}.source-cta{background:none;padding:0;text-decoration:underline}}

.detail-row{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;padding:24px 0;border-bottom:1px solid var(--line)}.detail-row h3{margin:0;color:var(--ink);font-size:18px;line-height:1.5}.detail-row p{margin:0;font-size:18px;line-height:1.7}.detail-source{display:inline-flex;align-items:center;min-height:44px;margin-top:16px;font-size:16px;text-underline-offset:4px}.detail-source:hover{color:var(--blue)}@media(max-width:760px){.detail-row{display:block;padding:24px 0}.detail-row h3{font-size:18px;margin-bottom:8px}.detail-row p{font-size:17px}.detail-source{margin-top:12px}}

body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}.metric{position:relative;isolation:isolate;overflow:hidden;background:#101f37;color:#fff;border-radius:18px;padding:20px}.metric:before,.metric:after{content:"";position:absolute;z-index:-1;width:150px;height:150px;border-radius:50%;filter:blur(56px);opacity:.4}.metric:before{top:-80px;left:-70px;background:#41658a}.metric:after{bottom:-80px;right:-65px;background:#984f2d}.metric-bleed{position:absolute;z-index:2;bottom:-12px;left:-14px;white-space:nowrap;font-size:78px;line-height:1;font-weight:900;mix-blend-mode:plus-lighter;letter-spacing:-.06em;color:rgba(255,255,255,.08);pointer-events:none}.metric-glass{position:relative;z-index:4;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:20px;backdrop-filter:blur(14px) brightness(1.25);-webkit-backdrop-filter:blur(14px) brightness(1.25);box-shadow:0 2px 4px rgba(0,0,0,.5),0 8px 16px rgba(0,0,0,.35),0 20px 40px rgba(0,0,0,.22),0 40px 80px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.12)}.metric-glass:before{content:"";position:absolute;top:0;left:12px;right:12px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)}.metric .metric-number,.metric .publisher{color:#fff}</style></head><body>__BODY__<script>__ROUTER__</script><script>__APP__</script></body></html>
