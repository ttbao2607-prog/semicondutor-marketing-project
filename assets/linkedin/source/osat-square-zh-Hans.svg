<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">OSAT 追溯机制</title><desc id="desc">批次、测试、质量、在制品与成本结算数据核对流程示意。</desc>
  <rect width="1200" height="1200" fill="#07162f" /><circle cx="1040" cy="120" r="250" fill="#0c2d52" /><circle cx="150" cy="1080" r="260" fill="#073d4b" />
  <image href="https://www.digiwin.com.vn/wp-content/themes/dgw/images/logo.webp" x="72" y="62" width="215" height="60" preserveAspectRatio="xMinYMid meet" />
  <text x="72" y="220" fill="#57e1d0" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif" font-size="26" font-weight="700" letter-spacing="3">半导体运营</text>
  <text x="72" y="330" fill="#ffffff" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif" font-size="72" font-weight="700">OSAT：关联数据</text>
  <text x="72" y="410" fill="#ffffff" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif" font-size="72" font-weight="700">按批次</text>
  <text x="76" y="485" fill="#b9c7d9" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif" font-size="30">4M1E · 测试数据 · 质量 · 在制品 · 成本结算</text>
  <rect x="72" y="580" width="1056" height="250" rx="28" fill="#102b4d" stroke="#2a5879" stroke-width="2" />
  <g font-family="Arial,sans-serif" font-size="25" fill="#ffffff"><text x="120" y="650" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif">批次</text><text x="330" y="650" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif">测试</text><text x="540" y="650" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif">质量</text><text x="790" y="650" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif">成本</text></g>
  <g stroke="#57e1d0" stroke-width="5" fill="none"><path d="M170 700H285" /><path d="M385 700H495" /><path d="M645 700H745" /><path d="M220 760H850" /></g>
  <g fill="#57e1d0"><circle cx="170" cy="700" r="14" /><circle cx="385" cy="700" r="14" /><circle cx="645" cy="700" r="14" /><circle cx="850" cy="700" r="14" /></g>
  <text x="120" y="808" fill="#b9c7d9" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif" font-size="24">用于核对追溯链与运营问题的机制框架。</text>
  <text x="72" y="955" fill="#ffffff" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif" font-size="32" font-weight="700">核对一个具体的 OSAT 运营问题</text>
  <text x="72" y="1015" fill="#57e1d0" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif" font-size="24">从批次到成本结算，沿同一条核对链</text>
</svg>