<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Fabless 委外在製品機制</title><desc id="desc">Fabless 預測、委外在製品與成本檢視流程示意。</desc>
  <rect width="1200" height="1200" fill="#101b38" /><path d="M0 920L1200 350V1200H0Z" fill="#17395a" /><circle cx="1060" cy="150" r="240" fill="#0a4a50" />
  <image href="https://www.digiwin.com.vn/wp-content/themes/dgw/images/logo.webp" x="72" y="62" width="215" height="60" preserveAspectRatio="xMinYMid meet" />
  <text x="72" y="220" fill="#57e1d0" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="26" font-weight="700" letter-spacing="3">FABLESS 商業化</text>
  <text x="72" y="340" fill="#ffffff" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="70" font-weight="700">管理</text>
  <text x="72" y="420" fill="#ffffff" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="70" font-weight="700">委外在製品</text>
  <text x="76" y="495" fill="#b9c7d9" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="30">預測 · 日期碼 · BIN · 批次 · 成本</text>
  <g stroke="#57e1d0" stroke-width="5" fill="none"><rect x="100" y="625" width="250" height="125" rx="18" /><rect x="475" y="625" width="250" height="125" rx="18" /><rect x="850" y="625" width="250" height="125" rx="18" /><path d="M350 687H475M725 687H850" /></g>
  <g fill="#ffffff" font-family="Arial,sans-serif" font-size="27" text-anchor="middle"><text x="225" y="680" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif">預測</text><text x="600" y="680" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif">委外在製品</text><text x="975" y="680" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif">成本</text></g>
  <text x="100" y="825" fill="#b9c7d9" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="24">將委外生產狀態與規劃及產品資料串聯。</text>
  <text x="72" y="975" fill="#ffffff" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="32" font-weight="700">檢視 Fabless 營運問題</text>
  <text x="72" y="1035" fill="#57e1d0" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="24">釐清狀態、交接點與檢視資料</text>
