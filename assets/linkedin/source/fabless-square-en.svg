<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Fabless outsourced WIP mechanism</title><desc id="desc">Diagram of the Fabless review flow across forecast, outsourced WIP and cost.</desc>
  <rect width="1200" height="1200" fill="#101b38" /><path d="M0 920L1200 350V1200H0Z" fill="#17395a" /><circle cx="1060" cy="150" r="240" fill="#0a4a50" />
  <image href="https://www.digiwin.com.vn/wp-content/themes/dgw/images/logo.webp" x="72" y="62" width="215" height="60" preserveAspectRatio="xMinYMid meet" />
  <text x="72" y="220" fill="#57e1d0" font-family="Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="3">FABLESS COMMERCIALIZATION</text>
  <text x="72" y="340" fill="#ffffff" font-family="Arial,sans-serif" font-size="70" font-weight="700">Manage</text>
  <text x="72" y="420" fill="#ffffff" font-family="Arial,sans-serif" font-size="70" font-weight="700">outsourced WIP</text>
  <text x="76" y="495" fill="#b9c7d9" font-family="Arial,sans-serif" font-size="30">forecast · datecode · BIN · lot · cost</text>
  <g stroke="#57e1d0" stroke-width="5" fill="none"><rect x="100" y="625" width="250" height="125" rx="18" /><rect x="475" y="625" width="250" height="125" rx="18" /><rect x="850" y="625" width="250" height="125" rx="18" /><path d="M350 687H475M725 687H850" /></g>
  <g fill="#ffffff" font-family="Arial,sans-serif" font-size="27" text-anchor="middle"><text x="225" y="680">FORECAST</text><text x="600" y="680">OUTSOURCE WIP</text><text x="975" y="680">COST</text></g>
  <text x="100" y="825" fill="#b9c7d9" font-family="Arial,sans-serif" font-size="24">Connect outsourced production status with planning and product data.</text>
  <text x="72" y="975" fill="#ffffff" font-family="Arial,sans-serif" font-size="32" font-weight="700">Review a Fabless operating question</text>
  <text x="72" y="1035" fill="#57e1d0" font-family="Arial,sans-serif" font-size="24">Clarify status, handoffs and review data</text>
</svg>