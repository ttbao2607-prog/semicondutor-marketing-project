<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">OSAT traceability mechanism</title><desc id="desc">Minh họa luồng đối chiếu dữ liệu lot, test, quality, WIP và cost close.</desc>
  <rect width="1200" height="1200" fill="#07162f"/><circle cx="1040" cy="120" r="250" fill="#0c2d52"/><circle cx="150" cy="1080" r="260" fill="#073d4b"/>
  <image href="https://www.digiwin.com.vn/wp-content/themes/dgw/images/logo.webp" x="72" y="62" width="215" height="60" preserveAspectRatio="xMinYMid meet"/>
  <text x="72" y="220" fill="#57e1d0" font-family="Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="3">SEMICONDUCTOR OPERATIONS</text>
  <text x="72" y="330" fill="#ffffff" font-family="Arial,sans-serif" font-size="72" font-weight="700">OSAT: Nối dữ liệu</text>
  <text x="72" y="410" fill="#ffffff" font-family="Arial,sans-serif" font-size="72" font-weight="700">theo lot</text>
  <text x="76" y="485" fill="#b9c7d9" font-family="Arial,sans-serif" font-size="30">4M1E · test data · quality · WIP · cost close</text>
  <rect x="72" y="580" width="1056" height="250" rx="28" fill="#102b4d" stroke="#2a5879" stroke-width="2"/>
  <g font-family="Arial,sans-serif" font-size="25" fill="#ffffff"><text x="120" y="650">LOT</text><text x="330" y="650">TEST</text><text x="540" y="650">QUALITY</text><text x="790" y="650">COST</text></g>
  <g stroke="#57e1d0" stroke-width="5" fill="none"><path d="M170 700H285"/><path d="M385 700H495"/><path d="M645 700H745"/><path d="M220 760H850"/></g>
  <g fill="#57e1d0"><circle cx="170" cy="700" r="14"/><circle cx="385" cy="700" r="14"/><circle cx="645" cy="700" r="14"/><circle cx="850" cy="700" r="14"/></g>
  <text x="120" y="808" fill="#b9c7d9" font-family="Arial,sans-serif" font-size="24">Một khung cơ chế để đối chiếu traceability và câu hỏi vận hành.</text>
  <text x="72" y="955" fill="#ffffff" font-family="Arial,sans-serif" font-size="32" font-weight="700">Đối chiếu một pain point OSAT cụ thể</text>
  <text x="72" y="1015" fill="#57e1d0" font-family="Arial,sans-serif" font-size="24">Từ lot đến cost close, theo một mạch đối chiếu</text>
</svg>
