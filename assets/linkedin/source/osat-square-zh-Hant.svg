<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">OSAT 追溯機制</title><desc id="desc">批次、測試、品質、在製品與成本結算資料檢視流程示意。</desc>
  <rect width="1200" height="1200" fill="#07162f" /><circle cx="1040" cy="120" r="250" fill="#0c2d52" /><circle cx="150" cy="1080" r="260" fill="#073d4b" />
  <image href="https://www.digiwin.com.vn/wp-content/themes/dgw/images/logo.webp" x="72" y="62" width="215" height="60" preserveAspectRatio="xMinYMid meet" />
  <text x="72" y="220" fill="#57e1d0" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="26" font-weight="700" letter-spacing="3">半導體營運</text>
  <text x="72" y="330" fill="#ffffff" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="72" font-weight="700">OSAT：串聯資料</text>
  <text x="72" y="410" fill="#ffffff" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="72" font-weight="700">依批次</text>
  <text x="76" y="485" fill="#b9c7d9" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="30">4M1E · 測試資料 · 品質 · 在製品 · 成本結算</text>
  <rect x="72" y="580" width="1056" height="250" rx="28" fill="#102b4d" stroke="#2a5879" stroke-width="2" />
  <g font-family="Arial,sans-serif" font-size="25" fill="#ffffff"><text x="120" y="650" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif">批次</text><text x="330" y="650" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif">測試</text><text x="540" y="650" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif">品質</text><text x="790" y="650" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif">成本</text></g>
  <g stroke="#57e1d0" stroke-width="5" fill="none"><path d="M170 700H285" /><path d="M385 700H495" /><path d="M645 700H745" /><path d="M220 760H850" /></g>
  <g fill="#57e1d0"><circle cx="170" cy="700" r="14" /><circle cx="385" cy="700" r="14" /><circle cx="645" cy="700" r="14" /><circle cx="850" cy="700" r="14" /></g>
  <text x="120" y="808" fill="#b9c7d9" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="24">用於檢視追溯鏈與營運問題的機制框架。</text>
  <text x="72" y="955" fill="#ffffff" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="32" font-weight="700">檢視一個具體的 OSAT 營運問題</text>
  <text x="72" y="1015" fill="#57e1d0" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="24">從批次到成本結算，沿同一條檢視脈絡</text>
</svg>