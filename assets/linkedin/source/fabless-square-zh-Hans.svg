<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Fabless 委外在制品机制</title><desc id="desc">Fabless 预测、委外在制品与成本核对流程示意。</desc>
  <rect width="1200" height="1200" fill="#101b38" /><path d="M0 920L1200 350V1200H0Z" fill="#17395a" /><circle cx="1060" cy="150" r="240" fill="#0a4a50" />
  <image href="https://www.digiwin.com.vn/wp-content/themes/dgw/images/logo.webp" x="72" y="62" width="215" height="60" preserveAspectRatio="xMinYMid meet" />
  <text x="72" y="220" fill="#57e1d0" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif" font-size="26" font-weight="700" letter-spacing="3">FABLESS 商业化</text>
  <text x="72" y="340" fill="#ffffff" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif" font-size="70" font-weight="700">管理</text>
  <text x="72" y="420" fill="#ffffff" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif" font-size="70" font-weight="700">委外在制品</text>
  <text x="76" y="495" fill="#b9c7d9" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif" font-size="30">预测 · 日期码 · BIN · 批次 · 成本</text>
  <g stroke="#57e1d0" stroke-width="5" fill="none"><rect x="100" y="625" width="250" height="125" rx="18" /><rect x="475" y="625" width="250" height="125" rx="18" /><rect x="850" y="625" width="250" height="125" rx="18" /><path d="M350 687H475M725 687H850" /></g>
  <g fill="#ffffff" font-family="Arial,sans-serif" font-size="27" text-anchor="middle"><text x="225" y="680" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif">预测</text><text x="600" y="680" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif">委外在制品</text><text x="975" y="680" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif">成本</text></g>
  <text x="100" y="825" fill="#b9c7d9" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif" font-size="24">将委外生产状态与计划及产品数据关联。</text>
  <text x="72" y="975" fill="#ffffff" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif" font-size="32" font-weight="700">核对 Fabless 运营问题</text>
  <text x="72" y="1035" fill="#57e1d0" font-family="Arial,'Microsoft YaHei','SimSun',sans-serif" font-size="24">明确状态、交接点与核对数据</text>
</svg>