<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">ERP MES OT 整合機制</title><desc id="desc">ERP、MES 與 OT 之間的資料交接示意。</desc>
  <rect width="1200" height="1200" fill="#071d34" /><path d="M0 0H1200V280L0 920Z" fill="#0c3653" /><circle cx="1050" cy="1010" r="250" fill="#064e4c" />
  <image href="https://www.digiwin.com.vn/wp-content/themes/dgw/images/logo.webp" x="72" y="62" width="215" height="60" preserveAspectRatio="xMinYMid meet" />
  <text x="72" y="220" fill="#57e1d0" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="26" font-weight="700" letter-spacing="3">供應商 · SI · 自動化</text>
  <text x="72" y="340" fill="#ffffff" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="70" font-weight="700">串接 ERP、MES</text>
  <text x="72" y="420" fill="#ffffff" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="70" font-weight="700">與 OT</text>
  <text x="76" y="495" fill="#b9c7d9" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="30">資料交接 · 責任歸屬 · 品質 · 追溯</text>
  <g fill="#102f4d" stroke="#57e1d0" stroke-width="5"><circle cx="255" cy="690" r="105" /><circle cx="600" cy="690" r="105" /><circle cx="945" cy="690" r="105" /></g>
  <g fill="#ffffff" font-family="Arial,sans-serif" font-size="27" text-anchor="middle"><text x="255" y="680" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif">ERP</text><text x="255" y="720" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif">來源</text><text x="600" y="680" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif">MES</text><text x="600" y="720" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif">交接</text><text x="945" y="680" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif">OT</text><text x="945" y="720" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif">動作</text></g>
  <g stroke="#57e1d0" stroke-width="5"><path d="M360 690H495" /><path d="M705 690H840" /></g>
  <text x="72" y="950" fill="#ffffff" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="32" font-weight="700">釐清一個受阻的整合交接點</text>
  <text x="72" y="1010" fill="#57e1d0" font-family="Arial,'Microsoft JhengHei','MingLiU',sans-serif" font-size="24">釐清資料來源、交接點與責任</text>
