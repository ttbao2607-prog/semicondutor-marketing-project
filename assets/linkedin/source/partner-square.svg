<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">ERP MES OT integration mechanism</title><desc id="desc">Minh họa điểm giao nhận dữ liệu giữa ERP, MES và OT.</desc>
  <rect width="1200" height="1200" fill="#071d34"/><path d="M0 0H1200V280L0 920Z" fill="#0c3653"/><circle cx="1050" cy="1010" r="250" fill="#064e4c"/>
  <image href="https://www.digiwin.com.vn/wp-content/themes/dgw/images/logo.webp" x="72" y="62" width="215" height="60" preserveAspectRatio="xMinYMid meet"/>
  <text x="72" y="220" fill="#57e1d0" font-family="Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="3">SUPPLIER · SI · AUTOMATION</text>
  <text x="72" y="340" fill="#ffffff" font-family="Arial,sans-serif" font-size="70" font-weight="700">Nối ERP, MES</text>
  <text x="72" y="420" fill="#ffffff" font-family="Arial,sans-serif" font-size="70" font-weight="700">và OT</text>
  <text x="76" y="495" fill="#b9c7d9" font-family="Arial,sans-serif" font-size="30">data handoff · ownership · quality · traceability</text>
  <g fill="#102f4d" stroke="#57e1d0" stroke-width="5"><circle cx="255" cy="690" r="105"/><circle cx="600" cy="690" r="105"/><circle cx="945" cy="690" r="105"/></g>
  <g fill="#ffffff" font-family="Arial,sans-serif" font-size="27" text-anchor="middle"><text x="255" y="680">ERP</text><text x="255" y="720">SOURCE</text><text x="600" y="680">MES</text><text x="600" y="720">HANDOFF</text><text x="945" y="680">OT</text><text x="945" y="720">ACTION</text></g>
  <g stroke="#57e1d0" stroke-width="5"><path d="M360 690H495"/><path d="M705 690H840"/></g>
  <text x="72" y="950" fill="#ffffff" font-family="Arial,sans-serif" font-size="32" font-weight="700">Làm rõ một điểm nối đang vướng</text>
  <text x="72" y="1010" fill="#57e1d0" font-family="Arial,sans-serif" font-size="24">Làm rõ nguồn dữ liệu, điểm giao nhận và trách nhiệm</text>
