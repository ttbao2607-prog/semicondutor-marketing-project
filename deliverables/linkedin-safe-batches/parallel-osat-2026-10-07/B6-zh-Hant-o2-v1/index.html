;function show(i){pos=i;const x=data[i];q('stage').textContent=x.stage+' · '+x.card_id;q('caption').textContent=x.caption;q('art').src=x.image;q('art').alt=x.alt;q('native').textContent=x.native_headline;q('counter').textContent=(i+1)+' / '+data.length;q('prev').disabled=i===0;q('next').disabled=i===data.length-1;q('script').textContent=JSON.stringify(x,null,2);Array.from(q('cards').children).forEach((b,k)=>b.setAttribute('aria-pressed',String(k===i)))}q('prev').onclick=()=>show(pos-1);q('next').onclick=()=>show(pos+1);q('feed').onclick=()=>{document.body.classList.add('feed');q('feed').setAttribute('aria-pressed','true');q('desktop').setAttribute('aria-pressed','false')};q('desktop').onclick=()=>{document.body.classList.remove('feed');q('feed').setAttribute('aria-pressed','false');q('desktop').setAttribute('aria-pressed','true')};show(0);</script></html>
