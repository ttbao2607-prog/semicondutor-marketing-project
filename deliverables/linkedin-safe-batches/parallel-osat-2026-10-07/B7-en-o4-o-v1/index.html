n a named China packaging and testing case.", "image": "assets/09-rmk-r4-3.png"}, {"card_id": "RMK-R4-4", "headline": "Explore the implementation detail.", "body": "Read how 江苏中科智芯集成科技有限公司 links production records, distributes parameter changes and records exceptions.", "source_text": "Digiwin · Packaging/testing case · China\n江苏中科智芯集成科技有限公司", "cta": "Read the records and exception workflow", "native_headline": "Explore the implementation detail.", "alt": "Illustration: Explore the implementation detail.", "artwork_labels": ["SEMICONDUCTOR CASE", "4/4"], "stage": "proof", "caption": "We provide digital solutions for manufacturing. Explore linked records and exception workflows in a named China packaging and testing case.", "image": "assets/10-rmk-r4-4.png"}];let pos=0;const q=id=>document.getElementById(id);data.forEach((x,i)=>{const b=document.createElement('button');b.textContent=i+1;b.setAttribute('aria-label','Card '+(i+1));b.onclick=()=>show(i);q('cards').append(b)});function show(i){pos=i;const x=data[i];q('stage').textContent=x.stage+' · '+x.card_id;q('caption').textContent=x.caption;q('art').src=x.image;q('art').alt=x.alt;q('native').textContent=x.native_headline;q('counter').textContent=(i+1)+' / '+data.length;q('prev').disabled=i===0;q('next').disabled=i===data.length-1;q('script').textContent=JSON.stringify(x,null,2);Array.from(q('cards').children).forEach((b,k)=>b.setAttribute('aria-pressed',String(k===i)))}q('prev').onclick=()=>show(pos-1);q('next').onclick=()=>show(pos+1);q('feed').onclick=()=>{document.body.classList.add('feed');q('feed').setAttribute('aria-pressed','true');q('desktop').setAttribute('aria-pressed','false')};q('desktop').onclick=()=>{document.body.classList.remove('feed');q('feed').setAttribute('aria-pressed','false');q('desktop').setAttribute('aria-pressed','true')};show(0);</script></html>
