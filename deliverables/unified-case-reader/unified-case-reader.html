<div class="hero-split"><section class="intro"><div class="eyebrow"><strong data-i18n="caseLabel" >Packaging &amp; testing</strong><span data-i18n="market" >Reference case · China</span></div><h1 data-i18n="title" >A shared starting point for quality review</h1><p data-i18n="lead" class="lead" >An unexpected test result calls for a clear starting point: the lot, the production context and the person who checks the record next. Explore how a named packaging and testing business connects production records with Digiwin ERP + iMES.</p></section><div class="v-divider" aria-hidden="true"></div><figure class="hero"><div class="bezel"><div class="bezel-inner"><img class="case-photo" src="" width="1080" height="656" alt="Group outside the customer building holding a banner bearing Digiwin branding and the name 江苏中科智芯集成科技有限公司." data-i18n-attr="alt:figureAlt" decoding="async"></div></div><figcaption><span data-i18n="figure" >Digiwin’s visit to 江苏中科智芯集成科技有限公司 · September 2020.</span><a data-i18n="figureSource" href="https://www.sohu.com/a/420465147_722372" target="_blank" rel="noopener noreferrer">Source: 鼎捷智造___new on Sohu · original photo contains Chinese text</a></figcaption></figure></div><article data-i18n-attr="aria-label:articleLabel"><section class="section"><p class="section-index"><span>01</span><span data-i18n="contextIndex" >The business context</span></p><div><h2 data-i18n="contextTitle" >Records and processes need to work together</h2><p data-i18n="contextBody" class="body-copy" >According to the case published by Digiwin Vietnam, 江苏中科智芯集成科技有限公司 in China implemented an integrated ERP + iMES solution. The published problems include disorganized records, nonstandard processes and low outsourcing and production efficiency.</p><div class="systems"><span>ERP + iMES</span><span>江苏中科智芯集成科技有限公司</span></div></div></section><section class="section"><p class="section-index"><span>02</span><span data-i18n="mechanismIndex" >Inside the case</span></p><div><h2 data-i18n="mechanismTitle" >How the implementation connects information</h2><p data-i18n="mechanismLead" class="body-copy" >The published mechanisms span shopfloor data, production records, parameter changes and exception handling within the integrated solution.</p><ol class="mechanism-details"><li><h3 data-i18n="m0Title" >Shopfloor information · SPC</h3><p data-i18n="m0Body" >SPC (statistical process control) collects and analyzes shopfloor information in real time.</p></li><li><h3 data-i18n="m1Title" >Parameter changes · ECN</h3><p data-i18n="m1Body" >ECN (engineering change notice) distributes process parameter changes in real time.</p></li><li><h3 data-i18n="m2Title" >Linked records</h3><p data-i18n="m2Body" >MES links batches, workstations, operators and products/materials for tracing from different perspectives.</p></li><li><h3 data-i18n="m3Title" >Exception recording &amp; escalation</h3><p data-i18n="m3Body" >The system automatically opens exception records and escalates them through successive levels.</p></li></ol></div></section><section class="section value-section"><p class="section-index"><span>03</span><span data-i18n="valueIndex" >Review your current setup</span></p><div><h2 data-i18n="valueTitle" >Give Quality and Operations a shared basis for the next check</h2><p data-i18n="valueLead" class="value-intro" >Use the case as a reference for these questions about your own review workflow.</p><ol class="value-items"><li class="value-item"><h3 data-i18n="v1Title" >Start from the same lot and context</h3><p data-i18n="v1Body" >When a result needs review, can both teams locate the lot, test time and related production record?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v1Prepare" >Prepare one example of a lot record and how it reaches the review team.</span></p></li><li class="value-item"><h3 data-i18n="v2Title" >Make the next check and owner clear</h3><p data-i18n="v2Body" >Who confirms the information source, checks missing records and follows up an exception?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v2Prepare" >Prepare your current handoff steps and the roles responsible for each check.</span></p></li><li class="value-item"><h3 data-i18n="v3Title" >Keep changes visible during review</h3><p data-i18n="v3Body" >Where do teams find the applicable parameter revision and the record of an exception?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v3Prepare" >Prepare one parameter-change record and an example of exception follow-up.</span></p></li></ol><p data-i18n="bridge" class="value-bridge" >A clear view of records and responsibilities can help your teams identify where coordination needs attention. Start the discussion with one actual review workflow at your company.</p></div></section></article><section class="consult"><div class="consult-inner"><p data-i18n="consultLabel" class="section-label" >Talk with Digiwin Vietnam</p><h2 data-i18n="consultTitle" >Bring one quality-review workflow to the discussion</h2><p data-i18n="consultBody" >Describe how Quality and Operations share lot records, confirm changes and assign the next check. We provide digital solutions for manufacturing, from ERP to smart manufacturing.</p><p data-i18n="next" class="next-step" >The next step opens Digiwin Vietnam’s consultation request page in Vietnamese.</p><a class="cta" href="https://www.digiwin.com.vn/contact-vn/"><span data-i18n="cta" class="btn-label" >Discuss records and review ownership</span><span class="btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span></a></div></section><section class="source"><strong data-i18n="sourceLabel" >Reference source</strong><div><a data-i18n="sourceLink" href="https://www.digiwin.com.vn/resources/digiwin-semiconductor-8-case-studies-cn/" target="_blank" rel="noopener noreferrer">Read the Chinese case collection</a><p data-i18n="sourceHint" >In the source, select 封装测试, then 案例 06 江苏中科智芯集成科技有限公司.</p><p data-i18n="sourceLang" >Source: Simplified Chinese · this page summarizes the named case.</p></div></section>
</template>
<template id="tpl-O2">
<div class="hero-split"><section class="intro"><div class="eyebrow"><strong data-i18n="caseLabel" >封裝測試</strong><span data-i18n="market" >參考案例 · 中國</span></div><h1 data-i18n="title" >A shared starting point for quality review</h1><p data-i18n="lead" class="lead" >同一批次的兩份狀態報告，可能對應不同製程階段或紀錄時間。下一次交接前，先對齊背景、來源紀錄與確認負責人。了解一家封裝測試企業如何透過Digiwin ERP + iMES關聯生產紀錄。</p></section><div class="v-divider" aria-hidden="true"></div><figure class="hero"><div class="bezel"><div class="bezel-inner"><img class="case-photo" src="" width="1080" height="656" alt="參訪團在客戶建築前合影，橫幅帶有鼎捷品牌及江苏中科智芯集成科技有限公司名稱。" data-i18n-attr="alt:figureAlt" decoding="async"></div></div><figcaption><span data-i18n="figure" >鼎捷走進江苏中科智芯集成科技有限公司 · 2020年9月。</span><a data-i18n="figureSource" href="https://www.sohu.com/a/420465147_722372" target="_blank" rel="noopener noreferrer">圖片來源：搜狐「鼎捷智造___new」· 原圖含中文文字</a></figcaption></figure></div><article data-i18n-attr="aria-label:articleLabel" aria-label="生產紀錄與批次交接"><section class="section"><p class="section-index"><span>01</span><span data-i18n="contextIndex" >企業背景</span></p><div><h2 data-i18n="contextTitle" >Records and processes need to work together</h2><p data-i18n="contextBody" class="body-copy" >根據Digiwin越南發布的案例，中國江苏中科智芯集成科技有限公司導入ERP + iMES整合方案。案例揭露的問題包括紀錄管理紊亂、業務流程不規範，以及委外與生產效率偏低。</p><div class="systems"><span>ERP + iMES</span><span>江苏中科智芯集成科技有限公司</span></div></div></section><section class="section"><p class="section-index"><span>02</span><span data-i18n="mechanismIndex" >案例中的管理機制</span></p><div><h2 data-i18n="mechanismTitle" >How the implementation connects information</h2><p data-i18n="mechanismLead" class="body-copy" >案例揭露的機制涵蓋現場資料、生產紀錄、參數變更與異常處理，屬於該企業採用的整合方案。</p><ol class="mechanism-details"><li><h3 data-i18n="m0Title" >Shopfloor information · SPC</h3><p data-i18n="m0Body" >SPC（統計製程管制）即時蒐集與分析現場資訊。</p></li><li><h3 data-i18n="m1Title" >Parameter changes · ECN</h3><p data-i18n="m1Body" >ECN（工程變更通知）即時下發製程參數變更。</p></li><li><h3 data-i18n="m2Title" >Linked records</h3><p data-i18n="m2Body" >MES 關聯批次、工站、操作人員及產品/物料，支援不同視角的追溯。</p></li><li><h3 data-i18n="m3Title" >Exception recording &amp; escalation</h3><p data-i18n="m3Body" >系統自動開立異常單，並逐層上報。</p></li></ol></div></section><section class="section value-section"><p class="section-index"><span>03</span><span data-i18n="valueIndex" >對照現行管理方式</span></p><div><h2 data-i18n="valueTitle" >Give Quality and Operations a shared basis for the next check</h2><p data-i18n="valueLead" class="value-intro" >參考該案例，透過以下問題梳理現行批次交接流程。</p><ol class="value-items"><li class="value-item"><h3 data-i18n="v1Title" >Start from the same lot and context</h3><p data-i18n="v1Body" >報告是否對應相同製程階段與紀錄時間？背景不同，兩份狀態報告可能都正確。</p><p class="prepare"><strong data-i18n="prepare" >可準備的資訊</strong><span data-i18n="v1Prepare" >同一批次的兩份狀態報告，以及各自的製程階段與紀錄時間。</span></p></li><li class="value-item"><h3 data-i18n="v2Title" >Make the next check and owner clear</h3><p data-i18n="v2Body" >下一步依據哪份來源紀錄？接收團隊需要哪些資訊？</p><p class="prepare"><strong data-i18n="prepare" >可準備的資訊</strong><span data-i18n="v2Prepare" >一次交接的來源紀錄，以及接收團隊所需的資訊。</span></p></li><li class="value-item"><h3 data-i18n="v3Title" >Keep changes visible during review</h3><p data-i18n="v3Body" >接收團隊更新批次狀態前，由誰核查缺漏資訊及其來源，由誰確認下一步？</p><p class="prepare"><strong data-i18n="prepare" >可準備的資訊</strong><span data-i18n="v3Prepare" >各項確認的負責角色，以及一次批次交接中缺漏資訊的實例。</span></p></li></ol><p data-i18n="bridge" class="value-bridge" >對齊批次背景、來源紀錄與職責，有助於找出交接中需要關注的環節。歡迎從貴企業的一次實際交接開始交流。</p></div></section></article><section class="consult"><div class="consult-inner"><p data-i18n="consultLabel" class="section-label" >與Digiwin越南交流</p><h2 data-i18n="consultTitle" >Bring one quality-review workflow to the discussion</h2><p data-i18n="consultBody" >貴企業可說明營運與品質團隊如何比較狀態報告、確認來源紀錄並安排下一步核查。我們提供製造業數位化方案，從ERP到智慧製造。</p><p data-i18n="next" class="next-step" >下一步將開啟Digiwin越南的諮詢申請頁面（越南語）。</p><a class="cta" href="https://www.digiwin.com.vn/contact-vn/"><span data-i18n="cta" class="btn-label" >交流批次紀錄與交接職責</span><span class="btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span></a></div></section><section class="source"><strong data-i18n="sourceLabel" >參考來源</strong><div><a data-i18n="sourceLink" href="https://www.digiwin.com.vn/resources/digiwin-semiconductor-8-case-studies-cn/" target="_blank" rel="noopener noreferrer">閱讀中文案例集</a><p data-i18n="sourceHint" >在來源頁選擇「封装测试」，再選擇「案例 06 江苏中科智芯集成科技有限公司」。</p><p data-i18n="sourceLang" >來源：簡體中文 · 此頁為該企業案例的摘要。</p></div></section>

<div class="hero-split"><section class="intro"><div class="eyebrow"><strong data-i18n="caseLabel" >Packaging &amp; testing</strong><span data-i18n="market" >Reference case · China</span></div><h1 data-i18n="title" >A shared starting point for quality review</h1><p data-i18n="lead" class="lead" >Before the cut-off, which lot records does Finance still need from Operations? Align unfinished work, completed output and losses for the same period, then clarify who confirms the handoff. Explore a named packaging and testing case using integrated Digiwin ERP + iMES.</p></section><div class="v-divider" aria-hidden="true"></div><figure class="hero"><div class="bezel"><div class="bezel-inner"><img class="case-photo" src="" width="1080" height="656" alt="Group outside the customer building holding a banner bearing Digiwin branding and the name 江苏中科智芯集成科技有限公司." data-i18n-attr="alt:figureAlt" decoding="async"></div></div><figcaption><span data-i18n="figure" >Digiwin’s visit to 江苏中科智芯集成科技有限公司 · September 2020.</span><a data-i18n="figureSource" href="https://www.sohu.com/a/420465147_722372" target="_blank" rel="noopener noreferrer">Source: 鼎捷智造___new on Sohu · original photo contains Chinese text</a></figcaption></figure></div><article data-i18n-attr="aria-label:articleLabel" aria-label="Factory records and month-end coordination"><section class="section"><p class="section-index"><span>01</span><span data-i18n="contextIndex" >The business context</span></p><div><h2 data-i18n="contextTitle" >Records and processes need to work together</h2><p data-i18n="contextBody" class="body-copy" >According to the case published by Digiwin Vietnam, 江苏中科智芯集成科技有限公司 in China implemented an integrated ERP + iMES solution. The published problems include disorganized records, nonstandard processes and low outsourcing and production efficiency.</p><div class="case-outcome"><h3 data-i18n="resultTitle"></h3><p class="case-result" data-i18n="resultValue">15 days → 5 days</p><p data-i18n="resultNote">Digiwin Vietnam reports this change for 江苏中科智芯集成科技有限公司 in China, using integrated ERP + iMES. This is a case result, not a promised close time or a calculation of financial ROI.</p></div><div class="systems"><span>ERP + iMES</span><span>江苏中科智芯集成科技有限公司</span></div></div></section><section class="section"><p class="section-index"><span>02</span><span data-i18n="mechanismIndex" >Inside the case</span></p><div><h2 data-i18n="mechanismTitle" >How the implementation connects information</h2><p data-i18n="mechanismLead" class="body-copy" >The published mechanisms span shopfloor data, production records, parameter changes and exception handling within the integrated solution.</p><ol class="mechanism-details"><li><h3 data-i18n="m0Title" >Shopfloor information · SPC</h3><p data-i18n="m0Body" >SPC (statistical process control) collects and analyzes shopfloor information in real time.</p></li><li><h3 data-i18n="m1Title" >Parameter changes · ECN</h3><p data-i18n="m1Body" >ECN (engineering change notice) distributes process parameter changes in real time.</p></li><li><h3 data-i18n="m2Title" >Linked records</h3><p data-i18n="m2Body" >MES links batches, workstations, operators and products/materials for tracing from different perspectives.</p></li><li><h3 data-i18n="m3Title" >Exception recording &amp; escalation</h3><p data-i18n="m3Body" >The system automatically opens exception records and escalates them through successive levels.</p></li></ol></div></section><section class="section value-section"><p class="section-index"><span>03</span><span data-i18n="valueIndex" >Review your current setup</span></p><div><h2 data-i18n="valueTitle" >Give Quality and Operations a shared basis for the next check</h2><p data-i18n="valueLead" class="value-intro" >Use the case as a reference for these questions about your current month-end records and handoff.</p><ol class="value-items"><li class="value-item"><h3 data-i18n="v1Title" >Start from the same lot and context</h3><p data-i18n="v1Body" >For each lot, which production stage and source record support the unfinished quantity, and who can verify it?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v1Prepare" >Prepare one lot’s unfinished-work record, its cut-off time and the role that confirms it.</span></p></li><li class="value-item"><h3 data-i18n="v2Title" >Make the next check and owner clear</h3><p data-i18n="v2Body" >Which records explain completed output, scrap and losses for the period under review with Finance?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v2Prepare" >Prepare output and loss records for one period, including the source and unresolved differences.</span></p></li><li class="value-item"><h3 data-i18n="v3Title" >Keep changes visible during review</h3><p data-i18n="v3Body" >Who checks the factory records, confirms the figures and resolves missing information before the handoff?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v3Prepare" >Prepare the confirmation roles, handoff time and one example of a record waiting for review.</span></p></li></ol><p data-i18n="bridge" class="value-bridge" >Clearer record sources and confirmation responsibilities can help teams identify where month-end coordination needs attention. The reported close-time result is a reference for discussion, not a forecast for another factory.</p></div></section></article><section class="consult"><div class="consult-inner"><p data-i18n="consultLabel" class="section-label" >Talk with Digiwin Vietnam</p><h2 data-i18n="consultTitle" >Bring one quality-review workflow to the discussion</h2><p data-i18n="consultBody" >Describe how Operations prepares unfinished-work, output and loss records, and how the handoff to Finance is confirmed. We provide digital solutions for manufacturing, from ERP to smart manufacturing.</p><p data-i18n="next" class="next-step" >The next step opens Digiwin Vietnam’s consultation request page in Vietnamese.</p><a class="cta" href="https://www.digiwin.com.vn/contact-vn/"><span data-i18n="cta" class="btn-label" >Discuss month-end records and handoff ownership</span><span class="btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span></a></div></section><section class="source"><strong data-i18n="sourceLabel" >Reference source</strong><div><a data-i18n="sourceLink" href="https://www.digiwin.com.vn/resources/digiwin-semiconductor-8-case-studies-cn/" target="_blank" rel="noopener noreferrer">Read the Chinese case collection</a><p data-i18n="sourceHint" >In the source, select 封装测试, then 案例 06 江苏中科智芯集成科技有限公司.</p><p data-i18n="sourceLang" >Source: Simplified Chinese · this page summarizes the named case.</p></div></section>

or one lot, with the stage and recording time of each.</span></p></li><li class="value-item"><h3 data-i18n="v2Title" >Make the next check and owner clear</h3><p data-i18n="v2Body" >Which source record supports the next step, and what information does the receiving team need?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v2Prepare" >Prepare the source record for one handoff and the receiving team’s information requirements.</span></p></li><li class="value-item"><h3 data-i18n="v3Title" >Keep changes visible during review</h3><p data-i18n="v3Body" >Who checks missing information and its source, and who confirms the next step before the receiving team updates lot status?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v3Prepare" >Prepare the confirmation roles and one example of missing information in a lot handoff.</span></p></li></ol><p data-i18n="bridge" class="value-bridge" >A shared view of lot context, source records and responsibilities can help teams identify where a handoff needs attention. Start the discussion with one actual handoff at your company.</p></div></section></article><section class="consult"><div class="consult-inner"><p data-i18n="consultLabel" class="section-label" >Talk with Digiwin Vietnam</p><h2 data-i18n="consultTitle" >Bring one quality-review workflow to the discussion</h2><p data-i18n="consultBody" >Describe how Operations and Quality compare status reports, confirm the source record and assign the next check. We provide digital solutions for manufacturing, from ERP to smart manufacturing.</p><p data-i18n="next" class="next-step" >The next step opens Digiwin Vietnam’s consultation request page in Vietnamese.</p><a class="cta" href="https://www.digiwin.com.vn/contact-vn/"><span data-i18n="cta" class="btn-label" >Discuss lot records and handoff responsibilities</span><span class="btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span></a></div></section><section class="source"><strong data-i18n="sourceLabel" >Reference source</strong><div><a data-i18n="sourceLink" href="https://www.digiwin.com.vn/resources/digiwin-semiconductor-8-case-studies-cn/" target="_blank" rel="noopener noreferrer">Read the Chinese case collection</a><p data-i18n="sourceHint" >In the source, select 封装测试, then 案例 06 江苏中科智芯集成科技有限公司.</p><p data-i18n="sourceLang" >Source: Simplified Chinese · this page summarizes the named case.</p></div></section>

<div class="hero-split"><section class="intro"><div class="eyebrow"><strong data-i18n="caseLabel" >Packaging &amp; testing</strong><span data-i18n="market" >Reference case · China</span></div><h1 data-i18n="title" >A shared starting point for quality review</h1><p data-i18n="lead" class="lead" >Which lot are we reviewing? What context needs checking? Who checks what is missing? Use these three questions to align a quality review of unusual test results, then explore how linked production records work in a named China case using integrated Digiwin ERP + iMES.</p></section><div class="v-divider" aria-hidden="true"></div><figure class="hero"><div class="bezel"><div class="bezel-inner"><img class="case-photo" src="" width="1080" height="656" alt="Group outside the customer building holding a banner bearing Digiwin branding and the name 江苏中科智芯集成科技有限公司." data-i18n-attr="alt:figureAlt" decoding="async"></div></div><figcaption><span data-i18n="figure" >Digiwin’s visit to 江苏中科智芯集成科技有限公司 · September 2020.</span><a data-i18n="figureSource" href="https://www.sohu.com/a/420465147_722372" target="_blank" rel="noopener noreferrer">Source: 鼎捷智造___new on Sohu · original photo contains Chinese text</a></figcaption></figure></div><article data-i18n-attr="aria-label:articleLabel" aria-label="Three questions for unusual test-result reviews"><section class="section"><p class="section-index"><span>01</span><span data-i18n="contextIndex" >The business context</span></p><div><h2 data-i18n="contextTitle" >Records and processes need to work together</h2><p data-i18n="contextBody" class="body-copy" >According to the case published by Digiwin Vietnam, 江苏中科智芯集成科技有限公司 in China implemented an integrated ERP + iMES solution. The published problems include disorganized records, nonstandard processes and low outsourcing and production efficiency.</p><div class="systems"><span>ERP + iMES</span><span>江苏中科智芯集成科技有限公司</span></div></div></section><section class="section"><p class="section-index"><span>02</span><span data-i18n="mechanismIndex" >Inside the case</span></p><div><h2 data-i18n="mechanismTitle" >How the implementation connects information</h2><p data-i18n="mechanismLead" class="body-copy" >The published mechanisms span shopfloor data, production records, parameter changes and exception handling within the integrated solution.</p><ol class="mechanism-details"><li><h3 data-i18n="m0Title" >Shopfloor information · SPC</h3><p data-i18n="m0Body" >SPC (statistical process control) collects and analyzes shopfloor information in real time.</p></li><li><h3 data-i18n="m1Title" >Parameter changes · ECN</h3><p data-i18n="m1Body" >ECN (engineering change notice) distributes process parameter changes in real time.</p></li><li><h3 data-i18n="m2Title" >Linked records</h3><p data-i18n="m2Body" >MES links batches, workstations, operators and products/materials for tracing from different perspectives.</p></li><li><h3 data-i18n="m3Title" >Exception recording &amp; escalation</h3><p data-i18n="m3Body" >The system automatically opens exception records and escalates them through successive levels.</p></li></ol></div></section><section class="section value-section"><p class="section-index"><span>03</span><span data-i18n="valueIndex" >Review your current setup</span></p><div><h2 data-i18n="valueTitle" >Give Quality and Operations a shared basis for the next check</h2><p data-i18n="valueLead" class="value-intro" >Bring Quality, Operations and test colleagues into one discussion about the lot, the surrounding records and who checks what is missing. This is an information-management view that complements the technical evaluation.</p><ol class="value-items"><li class="value-item"><h3 data-i18n="v1Title" >Start from the same lot and context</h3><p data-i18n="v1Body" >Do the lot ID, process stage and test time match the record? If lots were split or merged, are the relationships between records clear?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v1Prepare" >Prepare the records for one unusual test result, with lot ID, process stage and test time.</span></p></li><li class="value-item"><h3 data-i18n="v2Title" >Make the next check and owner clear</h3><p data-i18n="v2Body" >What do the records show about people, machines, materials, methods and environment? What else needs checking before discussing causes?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v2Prepare" >Prepare the records you have for people, machines, materials, methods and environment around that lot.</span></p></li><li class="value-item"><h3 data-i18n="v3Title" >Keep changes visible during review</h3><p data-i18n="v3Body" >Which source needs confirming, who checks it and what information is missing? Who is the next reviewer, and what should be added to the shared basis?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v3Prepare" >Prepare the source to confirm, the person checking it and one example of missing information.</span></p></li></ol><p data-i18n="bridge" class="value-bridge" >A shared view of the lot, its records and the review owners helps teams decide the next check without assuming a cause. Start the discussion with one actual unusual result at your company.</p></div></section></article><section class="consult"><div class="consult-inner"><p data-i18n="consultLabel" class="section-label" >Talk with Digiwin Vietnam</p><h2 data-i18n="consultTitle" >Bring one quality-review workflow to the discussion</h2><p data-i18n="consultBody" >Describe how Quality and Operations align on the lot, check context and assign the next reviewer. We provide digital solutions for manufacturing, from ERP to smart manufacturing.</p><p data-i18n="next" class="next-step" >The next step opens Digiwin Vietnam’s consultation request page in Vietnamese.</p><a class="cta" href="https://www.digiwin.com.vn/contact-vn/"><span data-i18n="cta" class="btn-label" >Discuss quality-review records and owners</span><span class="btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span></a></div></section><section class="source"><strong data-i18n="sourceLabel" >Reference source</strong><div><a data-i18n="sourceLink" href="https://www.digiwin.com.vn/resources/digiwin-semiconductor-8-case-studies-cn/" target="_blank" rel="noopener noreferrer">Read the Chinese case collection</a><p data-i18n="sourceHint" >In the source, select 封装测试, then 案例 06 江苏中科智芯集成科技有限公司.</p><p data-i18n="sourceLang" >Source: Simplified Chinese · this page summarizes the named case.</p></div></section>

<div class="hero-split"><section class="intro"><div class="eyebrow"><strong data-i18n="caseLabel" >Chip design</strong><span data-i18n="market" >Reference case · China</span></div><h1 data-i18n="title" >A shared starting point for quality review</h1><p data-i18n="lead" class="lead" >Which lot and process stage does each partner report describe? When was it recorded? Who confirms a production update? Use these questions to review how you coordinate outsourced production, then read a named China chip-design case.</p></section><div class="v-divider" aria-hidden="true"></div><figure class="hero"><div class="bezel"><div class="bezel-inner"><img class="case-photo" src="" width="1536" height="1024" alt="Illustration of a chip-design desk linked by data lines to three separate production sites and a stack of record sheets with a tag." data-i18n-attr="alt:figureAlt" decoding="async"></div></div><figcaption><span data-i18n="figure" >Illustration made for this page: a design team, outsourced production lots and record sheets. Not a photo of the customer or its sites.</span></figcaption></figure></div><article data-i18n-attr="aria-label:articleLabel" aria-label="Questions for outsourced production updates"><section class="section"><p class="section-index"><span>01</span><span data-i18n="contextIndex" >The business context</span></p><div><h2 data-i18n="contextTitle" >Records and processes need to work together</h2><p data-i18n="contextBody" class="body-copy" >The Digiwin Vietnam case collection presents Bright Power, 上海晶丰明源半导体股份有限公司, as a chip-design company in China. The source lists a long engineering response cycle, slow order response and low outsourcing-management efficiency, and describes an integrated digital solution.</p><div class="systems"><span>上海晶丰明源半导体股份有限公司</span></div></div></section><section class="section"><p class="section-index"><span>02</span><span data-i18n="mechanismIndex" >What the source reports</span></p><div><h2 data-i18n="mechanismTitle" >How the implementation connects information</h2><p data-i18n="mechanismLead" class="body-copy" >The source states the challenges and describes the solution only as integrated; it gives no detail on specific modules, so this page does not describe how the implementation works. The source notes that order handling and outsourcing coordination can also become a bottleneck for fabless companies.</p><ol class="mechanism-details"><li><h3 data-i18n="m0Title" >Shopfloor information · SPC</h3><p data-i18n="m0Body" >The source lists a long engineering response cycle.</p></li><li><h3 data-i18n="m1Title" >Parameter changes · ECN</h3><p data-i18n="m1Body" >The source lists slow order response.</p></li><li><h3 data-i18n="m2Title" >Linked records</h3><p data-i18n="m2Body" >The source lists low outsourcing-management efficiency.</p></li></ol></div></section><section class="section value-section"><p class="section-index"><span>03</span><span data-i18n="valueIndex" >Review your current setup</span></p><div><h2 data-i18n="valueTitle" >Give Quality and Operations a shared basis for the next check</h2><p data-i18n="valueLead" class="value-intro" >Bring operations and supply-chain colleagues into one discussion about what each partner report covers and who confirms it.</p><ol class="value-items"><li class="value-item"><h3 data-i18n="v1Title" >Start from the same lot and context</h3><p data-i18n="v1Body" >Which lot and process stage does each partner report describe, and when was it recorded?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v1Prepare" >Prepare two partner reports for one lot, with the stage and recording time of each.</span></p></li><li class="value-item"><h3 data-i18n="v2Title" >Make the next check and owner clear</h3><p data-i18n="v2Body" >Who confirms a production update before it informs the next decision?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v2Prepare" >Prepare the people or roles who confirm updates on both sides.</span></p></li><li class="value-item"><h3 data-i18n="v3Title" >Keep changes visible during review</h3><p data-i18n="v3Body" >Which shared reporting conventions support the next decision?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v3Prepare" >Prepare the identifiers, status terms and timing rules each partner uses.</span></p></li></ol><p data-i18n="bridge" class="value-bridge" >Aligning lot, stage, timing and confirmation across partner reports helps teams see where coordination needs attention. Start with one actual partner update at your company.</p></div></section></article><section class="consult"><div class="consult-inner"><p data-i18n="consultLabel" class="section-label" >Talk with Digiwin Vietnam</p><h2 data-i18n="consultTitle" >Bring one quality-review workflow to the discussion</h2><p data-i18n="consultBody" >Describe how your team reads partner reports, confirms updates and decides the next step. We provide digital solutions for manufacturing, from ERP to smart manufacturing.</p><p data-i18n="next" class="next-step" >The next step opens Digiwin Vietnam’s consultation request page in Vietnamese.</p><a class="cta" href="https://www.digiwin.com.vn/contact-vn/"><span data-i18n="cta" class="btn-label" >Discuss partner reports and update responsibilities</span><span class="btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span></a></div></section><section class="source"><strong data-i18n="sourceLabel" >Reference source</strong><div><a data-i18n="sourceLink" href="https://www.digiwin.com.vn/resources/digiwin-semiconductor-8-case-studies-cn/" target="_blank" rel="noopener noreferrer">Read the Chinese case collection</a><p data-i18n="sourceHint" >In the source, select IC设计, then 案例 04 上海晶丰明源半导体股份有限公司.</p><p data-i18n="sourceLang" >Source: Simplified Chinese · this page <div class="hero-split"><section class="intro"><div class="eyebrow"><strong data-i18n="caseLabel" >Chip design</strong><span data-i18n="market" >Reference case · China</span></div><h1 data-i18n="title" >A shared starting point for quality review</h1><p data-i18n="lead" class="lead" >Which product and planning period does the demand change concern? Which outsourced lots need review? Who confirms missing partner information before the next plan? Use these questions to review your planning discussion, then read a named China chip-design case.</p></section><div class="v-divider" aria-hidden="true"></div><figure class="hero"><div class="bezel"><div class="bezel-inner"><img class="case-photo" src="" width="1536" height="1024" alt="Illustration of a chip-design desk linked by data lines to three separate production sites and a stack of record sheets with a tag." data-i18n-attr="alt:figureAlt" decoding="async"></div></div><figcaption><span data-i18n="figure" >Illustration made for this page: a design team, outsourced production lots and record sheets. Not a photo of the customer or its sites.</span></figcaption></figure></div><article data-i18n-attr="aria-label:articleLabel" aria-label="Questions for outsourcing plan changes"><section class="section"><p class="section-index"><span>01</span><span data-i18n="contextIndex" >The business context</span></p><div><h2 data-i18n="contextTitle" >Records and processes need to work together</h2><p data-i18n="contextBody" class="body-copy" >The Digiwin Vietnam case collection presents Bright Power, 上海晶丰明源半导体股份有限公司, as a chip-design company in China. The source lists a long engineering response cycle, slow order response and low outsourcing-management efficiency, and describes an integrated digital solution.</p><div class="systems"><span>上海晶丰明源半导体股份有限公司</span></div></div></section><section class="section"><p class="section-index"><span>02</span><span data-i18n="mechanismIndex" >What the source reports</span></p><div><h2 data-i18n="mechanismTitle" >How the implementation connects information</h2><p data-i18n="mechanismLead" class="body-copy" >The source states the challenges and describes the solution only as integrated; it gives no detail on specific modules, so this page does not describe how the implementation works. The source notes that order handling and outsourcing coordination can also become a bottleneck for fabless companies.</p><ol class="mechanism-details"><li><h3 data-i18n="m0Title" >Shopfloor information · SPC</h3><p data-i18n="m0Body" >The source lists a long engineering response cycle.</p></li><li><h3 data-i18n="m1Title" >Parameter changes · ECN</h3><p data-i18n="m1Body" >The source lists slow order response.</p></li><li><h3 data-i18n="m2Title" >Linked records</h3><p data-i18n="m2Body" >The source lists low outsourcing-management efficiency.</p></li></ol></div></section><section class="section value-section"><p class="section-index"><span>03</span><span data-i18n="valueIndex" >Review your current setup</span></p><div><h2 data-i18n="valueTitle" >Give Quality and Operations a shared basis for the next check</h2><p data-i18n="valueLead" class="value-intro" >Bring planning and operations colleagues into one discussion about the demand change, the lots it affects and the partner information behind them.</p><ol class="value-items"><li class="value-item"><h3 data-i18n="v1Title" >Start from the same lot and context</h3><p data-i18n="v1Body" >Which product and planning period does the demand change concern?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v1Prepare" >Prepare the demand change, the product and the planning period it affects.</span></p></li><li class="value-item"><h3 data-i18n="v2Title" >Make the next check and owner clear</h3><p data-i18n="v2Body" >Which outsourced lots need review because of the change?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v2Prepare" >Prepare the lots in process at partners that the change may touch.</span></p></li><li class="value-item"><h3 data-i18n="v3Title" >Keep changes visible during review</h3><p data-i18n="v3Body" >When were partner reports recorded, what is their source, and who will confirm missing information before the next plan is discussed?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v3Prepare" >Prepare the recording time and source of each partner report, and who confirms gaps.</span></p></li></ol><p data-i18n="bridge" class="value-bridge" >Clarifying the demand change, the affected lots and the source of partner information helps teams see where planning needs attention. Start with one actual demand change at your company.</p></div></section></article><section class="consult"><div class="consult-inner"><p data-i18n="consultLabel" class="section-label" >Talk with Digiwin Vietnam</p><h2 data-i18n="consultTitle" >Bring one quality-review workflow to the discussion</h2><p data-i18n="consultBody" >Describe how your team reviews outsourced lots and partner reports when demand changes. We provide digital solutions for manufacturing, from ERP to smart manufacturing.</p><p data-i18n="next" class="next-step" >The next step opens Digiwin Vietnam’s consultation request page in Vietnamese.</p><a class="cta" href="https://www.digiwin.com.vn/contact-vn/"><span data-i18n="cta" class="btn-label" >Discuss demand changes and partner information</span><span class="btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span></a></div></section><section class="source"><strong data-i18n="sourceLabel" >Reference source</strong><div><a data-i18n="sourceLink" href="https://www.digiwin.com.vn/resources/digiwin-semiconductor-8-case-studies-cn/" target="_blank" rel="noopener noreferrer">Read the Chinese case collection</a><p data-i18n="sourceHint" >In the source, select IC设计, t nismTitle" >How the implementation connects information</h2><p data-i18n="mechanismLead" class="body-copy" >The source states the challenges and describes the solution only as integrated; it gives no detail on specific modules, so this page does not describe how the implementation works. The source notes that order handling and outsourcing coordination can also become a bottleneck for fabless companies.</p><ol class="mechanism-details"><li><h3 data-i18n="m0Title" >Shopfloor information · SPC</h3><p data-i18n="m0Body" >The source lists a long engineering response cycle.</p></li><li><h3 data-i18n="m1Title" >Parameter changes · ECN</h3><p data-i18n="m1Body" >The source lists slow order response.</p></li><li><h3 data-i18n="m2Title" >Linked records</h3><p data-i18n="m2Body" >The source lists low outsourcing-management efficiency.</p></li></ol></div></section><section class="section value-section"><p class="section-index"><span>03</span><span data-i18n="valueIndex" >Review your current setup</span></p><div><h2 data-i18n="valueTitle" >Give Quality and Operations a shared basis for the next check</h2><p data-i18n="valueLead" class="value-intro" >Bring both sides of the handoff into one discussion about its scope, the records that travel with it and who confirms differences.</p><ol class="value-items"><li class="value-item"><h3 data-i18n="v1Title" >Start from the same lot and context</h3><p data-i18n="v1Body" >Which handoff point and product are under review?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v1Prepare" >Prepare one handoff point and the product it concerns.</span></p></li><li class="value-item"><h3 data-i18n="v2Title" >Make the next check and owner clear</h3><p data-i18n="v2Body" >Which lots and record sources accompany the handoff?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v2Prepare" >Prepare the lots and the records or sources that travel with the handoff.</span></p></li><li class="value-item"><h3 data-i18n="v3Title" >Keep changes visible during review</h3><p data-i18n="v3Body" >If identifiers differ or information is missing, who confirms it on each side before the partners agree the next step?</p><p class="prepare"><strong data-i18n="prepare" >Information to prepare</strong><span data-i18n="v3Prepare" >Prepare an example of mismatched or missing information and the confirming roles on each side.</span></p></li></ol><p data-i18n="bridge" class="value-bridge" >Defining the handoff point, its records and the people who confirm differences helps both sides see where the handoff needs attention. Start with one actual handoff at your company.</p></div></section></article><section class="consult"><div class="consult-inner"><p data-i18n="consultLabel" class="section-label" >Talk with Digiwin Vietnam</p><h2 data-i18n="consultTitle" >Bring one quality-review workflow to the discussion</h2><p data-i18n="consultBody" >Describe how your team and the partner agree the lots, records and confirmations at a handoff. We provide digital solutions for manufacturing, from ERP to smart manufacturing.</p><p data-i18n="next" class="next-step" >The next step opens Digiwin Vietnam’s consultation request page in Vietnamese.</p><a class="cta" href="https://www.digiwin.com.vn/contact-vn/"><span data-i18n="cta" class="btn-label" >Discuss handoff records and confirmation</span><span class="btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span></a></div></section><section class="source"><strong data-i18n="sourceLabel" >Reference source</strong><div><a data-i18n="sourceLink" href="https://www.digiwin.com.vn/resources/digiwin-semiconductor-8-case-studies-cn/" target="_blank" rel="noopener noreferrer">Read the Chinese case collection</a><p data-i18n="sourceHint" >In the source, select IC设计, then 案例 04 上海晶丰明源半导体股份有限公司.</p><p data-i18n="sourceLang" > <template id="tpl-P1">
<div class="hero-split"><section class="intro"><div class="eyebrow"><strong data-i18n="caseLabel" >Supplier Operations</strong><span data-i18n="market" >Industry context · Taiwan / Shanghai</span></div><h1 data-i18n="title" >A shared starting point for quality review</h1><p data-i18n="lead" class="lead" >For semiconductor equipment-component suppliers, progress and quality information becomes useful when the source, scope and decision owner are clear.</p></section><div class="v-divider" aria-hidden="true"></div><figure class="hero"><div class="bezel"><div class="bezel-inner"><img class="case-photo" src="" width="1536" height="1024" alt="Illustration of a silicon crystal, a stack of wafers and an epitaxy chamber linked by data lines to a stack of record sheets and a range indicator." data-i18n-attr="alt:figureAlt" decoding="async"></div></div><figcaption><span data-i18n="figure" >Illustration made for this page: silicon crystal, wafers, epitaxy and production records. Not a photo of Wafer Works or its equipment.</span></figcaption></figure></div><article data-i18n-attr="aria-label:articleLabel" aria-label="From lot records to the next operating decision"><section class="section"><p class="section-index"><span>01</span><span data-i18n="s1Index" >Where to start</span></p><div><h2 data-i18n="s1h" ></h2><p data-i18n="s1p1" class="body-copy" >Choose one production lot and the planning decision that needs its progress or quality status. Identify the source record, when it was updated, and what it covers.</p><p data-i18n="s1p2" class="body-copy" >Agree who checks a mismatch, who receives the confirmed information and what evidence they need before the next step.</p></div></section><section class="section"><p class="section-index"><span>02</span><span data-i18n="s2Index" >Roles and responsibilities</span></p><div><h2 data-i18n="s2h" ></h2><p data-i18n="s2p1" class="body-copy" >ERP supports enterprise orders, materials, planning and costs. Manufacturing execution solutions support production progress, lot records and quality information.</p><p data-i18n="s2p2" class="body-copy" >Map the information each team needs before defining the solution scope and data handoff.</p></div></section><section class="section"><p class="section-index"><span>03</span><span data-i18n="s3Index" >Industry context</span></p><div><h2 data-i18n="s3h" ></h2><p data-i18n="s3p1" class="body-copy" >Wafer Works / 合晶科技, Taiwan / Shanghai, produces silicon wafer materials. The case covers crystal growth, wafer processing and epitaxy.</p><p data-i18n="s3p2" class="body-copy" >Digiwin describes production genealogy from silicon crystals to wafer lots, visibility into production progress and equipment status, and epitaxy history with quality parameter limits.</p><p data-i18n="s3p3" class="body-copy" >For an equipment-component supplier, these are useful questions about traceability and execution visibility to bring into its own process discussion.</p><div class="systems"><span>Wafer Works / 合晶科技</span></div></div></section></article><section class="consult"><div class="consult-inner"><p data-i18n="consultLabel" class="section-label" >Talk with Digiwin Vietnam</p><h2 data-i18n="s4h" ></h2><p data-i18n="s4p1" >Digiwin Vietnam specialists assess factory operations, advise on business processes and support on-site solution transfer and factory acceptance.</p><p data-i18n="s4p2" >Bring a current production-to-planning handoff to the discussion: its records, the people involved, the receiving decision and the gaps to resolve. This helps define the processes and implementation scope for your factory.</p></div></section><section class="source"><strong data-i18n="sourceLabel" >Reference source</strong><div><p><a data-i18n="src1" href="https://www.digiwin.com.tw/dsc/solution/semiconductor/index" target="_blank" rel="noopener noreferrer">Digiwin semiconductor solutions: Wafer Works</a></p><p><a data-i18n="src2" href="https://solutions.digiwin.com.vn/supplierecosystem" target="_blank" rel="noopener noreferrer">Digiwin Vietnam: supplier solutions and local delivery</a></p></div></section>
</template>
<template id="tpl-P2">
<div class="hero-split"><section class="intro"><div class="eyebrow"><strong data-i18n="caseLabel" >Supplier Systems</strong><span data-i18n="market" >Industry context · Taiwan / Shanghai</span></div><h1 data-i18n="title" >A shared starting point for quality review</h1><p data-i18n="lead" class="lead" >For semiconductor equipment-component suppliers, factory IT and operating teams need shared definitions, record responsibility and clear receiving decisions.</p></section><div class="v-divider" aria-hidden="true"></div><figure class="hero"><div class="bezel"><div class="bezel-inner"><img class="case-photo" src="" width="1536" height="1024" alt="Illustration of a silicon crystal, a stack of wafers and an epitaxy chamber linked by data lines to a stack of record sheets and a range indicator." data-i18n-attr="alt:figureAlt" decoding="async"></div></div><figcaption><span data-i18n="figure" >Illustration made for this page: silicon crystal, wafers, epitaxy and production records. Not a photo of Wafer Works or its equipment.</span></figcaption></figure></div><article data-i18n-attr="aria-label:articleLabel" aria-label="Define record ownership before a system handoff"><section class="section"><p class="section-index"><span>01</span><span data-i18n="s1Index" >Where to start</span></p><div><h2 data-i18n="s1h" ></h2><p data-i18n="s1p1" class="body-copy" >Choose one record that planning or quality teams need. Identify its meaning, update timing and production scope.</p><p data-i18n="s1p2" class="body-copy" >Record which team and system maintains it, who checks differences and who confirms the handoff.</p></div></section><section class="section"><p class="section-index"><span>02</span><span data-i18n="s2Index" >Roles and responsibilities</span></p><div><h2 data-i18n="s2h" ></h2><p data-i18n="s2p1" class="body-copy" >ERP supports enterprise orders, materials, planning and costs. Manufacturing execution solutions support production progress, lot records and quality information.</p><p data-i18n="s2p2" class="body-copy" >Use these roles to discuss record responsibility and process needs. Define the technical scope with the factory teams before selecting a handoff approach.</p></div></section><section class="section"><p class="section-index"><span>03</span><span data-i18n="s3Index" >Industry context</span></p><div><h2 data-i18n="s3h" ></h2><p data-i18n="s3p1" class="body-copy" >Wafer Works / 合晶科技 in Taiwan / Shanghai produces silicon wafer materials through crystal growth, wafer processing and epitaxy.</p><p data-i18n="s3p2" class="body-copy" >The case connects silicon crystals to wafer-lot production history and provides visibility into progress, equipment status and epitaxy records with quality parameter limits.</p><p data-i18n="s3p3" class="body-copy" >These production-information topics help factory teams identify the records and responsibilities to discuss in their own processes.</p><div class="systems"><span>Wafer Works / 合晶科技</span></div></div></section></article><section class="consult"><div class="consult-inner"><p data-i18n="consultLabel" class="section-label" >Talk with Digiwin Vietnam</p><h2 data-i18n="s4h" ></h2><p data-i18n="s4p1" >Digiwin Vietnam assesses factory operations, advises on business processes and supports on-site solution transfer and factory acceptance.</p><p data-i18n="s4p2" >Bring one current information handoff, its record owner, receiving decision and unresolved differences to a discussion of your process and implementation scope.</p></div></section><section class="source"><strong data-i18n="sourceLabel" >Reference source</strong><div><p><a data-i18n="src1" href="https://www.digiwin.com.tw/dsc/solution/semiconductor/index" target="_blank" rel="noopener noreferrer">Digiwin semiconductor solutions: Wafer Works</a></p><p><a data-i18n="src2" href="https://solutions.digiwin.com.vn/supplierecosystem" target="_blank" rel="noopener noreferrer">Digiwin Vietnam: supplier solutions and local services</a></p></div></section>
</template>
<template id="tpl-P3">
<div class="hero-split"><section class="intro"><div class="eyebrow"><strong data-i18n="caseLabel" >Supplier Quality</strong><span data-i18n="market" >Industry context · Taiwan / Shanghai</span></div><h1 data-i18n="title" >A shared starting point for quality review</h1><p data-i18n="lead" class="lead" >For PCB suppliers serving semiconductor and electronics equipment, quality and operating teams need clear record scope, sources and review responsibility.</p></section><div class="v-divider" aria-hidden="true"></div><figure class="hero"><div class="bezel"><div class="bezel-inner"><img class="case-photo" src="" width="1536" height="1024" alt="Illustration of a silicon crystal, a stack of wafers and an epitaxy chamber linked by data lines to a stack of record sheets and a range indicator." data-i18n-attr="alt:figureAlt" decoding="async"></div></div><figcaption><span data-i18n="figure" >Illustration made for this page: silicon crystal, wafers, epitaxy and production records. Not a photo of Wafer Works or its equipment.</span></figcaption></figure></div><article data-i18n-attr="aria-label:articleLabel" aria-label="Scope the customer question before collecting records"><section class="section"><p class="section-index"><span>01</span><span data-i18n="s1Index" >Where to start</span></p><div><h2 data-i18n="s1h" ></h2><p data-i18n="s1p1" class="body-copy" >Identify the lot, process step, time period and information requested. Use this scope to decide which records matter to the response.</p><p data-i18n="s1p2" class="body-copy" >Name who compares those records with the request, who resolves differences and who confirms the response.</p></div></section><section class="section"><p class="section-index"><span>02</span><span data-i18n="s2Index" >Roles and responsibilities</span></p><div><h2 data-i18n="s2h" ></h2><p data-i18n="s2p1" class="body-copy" >ERP supports enterprise orders, materials, planning and costs. Manufacturing execution solutions support production progress, lot records and quality information.</p><p data-i18n="s2p2" class="body-copy" >Identify the team or system maintaining each relevant source. Agree review responsibilities and unresolved gaps with factory teams before defining the solution scope.</p></div></section><section class="section"><p class="section-index"><span>03</span><span data-i18n="s3Index" >Industry context</span></p><div><h2 data-i18n="s3h" ></h2><p data-i18n="s3p1" class="body-copy" >Wafer Works / 合晶科技 in Taiwan / Shanghai produces silicon wafer materials through crystal growth, wafer processing and epitaxy.</p><p data-i18n="s3p2" class="body-copy" >The case connects silicon crystals to wafer-lot production history and provides visibility into progress, equipment status and epitaxy records with quality parameter limits.</p><p data-i18n="s3p3" class="body-copy" >This silicon-materials context helps quality teams discuss production record sources and scope. A PCB factory must define the records relevant to its own customer question.</p><div class="systems"><span>Wafer Works / 合晶科技</span></div></div></section></article><section class="consult"><div class="consult-inner"><p data-i18n="consultLabel" class="section-label" >Talk with Digiwin Vietnam</p><h2 data-i18n="s4h" ></h2><p data-i18n="s4p1" >Digiwin Vietnam assesses factory operations, advises on business processes and supports on-site solution transfer and factory acceptance.</p><p data-i18n="s4p2" >Bring one customer lot question, the relevant record sources, a review owner and unresolved gaps to a discussion of your process and implementation scope.</p></div></section><section class="source"><strong data-i18n="sourceLabel" >Reference source</strong><div><p><a data-i18n="src1" href="https://www.digiwin.com.tw/dsc/solution/semiconductor/index" target="_blank" rel="noopener noreferrer">Digiwin semiconductor solutions: Wafer Works</a></p><p><a data-i18n="src2" href="https://solutions.digiwin.com.vn/supplierecosystem" target="_blank" rel="noopener noreferrer">Digiwin Vietnam: supplier solutions and local services</a></p></div></section>
</template>

ng thực tế.", "consultLabel": "Trao đổi cùng Digiwin Việt Nam", "consultTitle": "Trao đổi từ một kết quả kiểm thử bất thường", "consultBody": "Quý Doanh Nghiệp có thể mô tả cách Chất lượng và Vận hành thống nhất về lô, kiểm tra bối cảnh và phân công người rà soát tiếp theo. Chúng tôi cung cấp giải pháp số hóa cho sản xuất, từ ERP đến sản xuất thông minh.", "next": "Bước tiếp theo mở trang yêu cầu tư vấn Digiwin Việt Nam bằng tiếng Việt.", "cta": "Trao đổi về hồ sơ và người phụ trách rà soát chất lượng", "sourceLabel": "Nguồn tham khảo", "sourceLink": "Đọc bộ case bằng tiếng Trung", "sourceHint": "Tại nguồn, chọn 封装测试, rồi chọn 案例 06 江苏中科智芯集成科技有限公司.", "sourceLang": "Nguồn: tiếng Trung giản thể · trang này tóm tắt case được nêu tên.", "footer": "Digiwin Việt Nam · Giải pháp quản trị doanh nghiệp", "m0Title": "Thông tin hiện trường · SPC", "m0Body": "SPC (kiểm soát quá trình bằng thống kê) thu thập và phân tích thông tin hiện trường theo thời gian thực.", "m1Title": "Thay đổi thông số · ECN", "m1Body": "ECN (thông báo thay đổi kỹ thuật) phân phối thay đổi thông số công nghệ theo thời gian thực.", "m2Title": "Hồ sơ liên kết", "m2Body": "MES liên kết lô, trạm làm việc, người vận hành và sản phẩm/vật liệu để truy vết theo các góc nhìn.", "m3Title": "Ghi nhận & báo cáo bất thường", "m3Body": "Hệ thống tự mở phiếu bất thường và báo cáo lần lượt lên các cấp."}, "en": {"title": "Three questions before reviewing unusual test results", "edition": "Manufacturing solutions", "back": "Back to the quality-review journey", "skip": "Skip to case content", "langLabel": "Language", "caseLabel": "Packaging & testing", "market": "Reference case · China", "lead": "Which lot are we reviewing? What context needs checking? Who checks what is missing? Use these three questions to align a quality review of unusual test results, then explore how linked production records work in a named China case using integrated Digiwin ERP + iMES.", "figure": "Digiwin’s visit to 江苏中科智芯集成科技有限公司 · September 2020.", "figureSource": "Source: 鼎捷智造___new on Sohu · original photo contains Chinese text", "figureAlt": "Group outside the customer building holding a banner bearing Digiwin branding and the name 江苏中科智芯集成科技有限公司.", "articleLabel": "Three questions for unusual test-result reviews", "contextIndex": "The business context", "contextTitle": "Records and processes need to work together", "contextBody": "According to the case published by Digiwin Vietnam, 江苏中科智芯集成科技有限公司 in China implemented an integrated ERP + iMES solution. The published problems include disorganized records, nonstandard processes and low outsourcing and production efficiency.", "mechanismIndex": "Inside the case", "mechanismTitle": "How the implementation connects information", "mechanismLead": "The published mechanisms span shopfloor data, production records, parameter changes and exception handling within the integrated solution.", "valueIndex": "Review your current setup", "valueTitle": "Give the review a shared basis before discussing causes", "valueLead": "Bring Quality, Operations and test colleagues into one discussion about the lot, the surrounding records and who checks what is missing. This is an information-management view that complements the technical evaluation.", "v1Title": "Confirm which lot is under review", "v1Body": "Do the lot ID, process stage and test time match the record? If lots were split or merged, are the relationships between records clear?", "v1Prepare": "Prepare the records for one unusual test result, with lot ID, process stage and test time.", "v2Title": "Check the surrounding context", "v2Body": "What do the records show about people, machines, materials, methods and environment? What else needs checking before discussing causes?", "v2Prepare": "Prepare the records you have for people, machines, materials, methods and environment around that lot.", "v3Title": "Name who checks what is missing", "v3Body": "Which source needs confirming, who checks it and what information is ord for one handoff and the receiving team’s information requirements.", "v3Title": "Make the confirmation owner and next check clear", "v3Body": "Who checks missing information and its source, and who confirms the next step before the receiving team updates lot status?", "v3Prepare": "Prepare the confirmation roles and one example of missing information in a lot handoff.", "prepare": "Information to prepare", "bridge": "A shared view of lot context, source records and responsibilities can help teams identify where a handoff needs attention. Start the discussion with one actual handoff at your company.", "consultLabel": "Talk with Digiwin Vietnam", "consultTitle": "Bring one lot-handoff workflow to the discussion", "consultBody": "Describe how Operations and Quality compare status reports, confirm the source record and assign the next check. We provide digital solutions for manufacturing, from ERP to smart manufacturing.", "next": "The next step opens Digiwin Vietnam’s consultation request page in Vietnamese.", "cta": "Discuss lot records and handoff responsibilities", "sourceLabel": "Reference source", "sourceLink": "Read the Chinese case collection", "sourceHint": "In the source, select 封装测试, then 案例 06 江苏中科智芯集成科技有限公司.", "sourceLang": "Source: Simplified Chinese · this page summarizes the named case.", "footer": "Digiwin Vietnam · Enterprise management solutions", "market": "Industry context · Taiwan / Shanghai", "figure": "Illustration made for this page: silicon crystal, wafers, epitaxy and production records. Not a photo of Wafer Works or its equipment.", "figureAlt": "Illustration of a silicon crystal, a stack of wafers and an epitaxy chamber linked by data lines to a stack of record sheets and a range indicator.", "s1Index": "Where to start", "s2Index": "Roles and responsibilities", "s3Index": "Industry context", "title": "Define record ownership before a system handoff", "lead": "For semiconductor equipment-component suppliers, factory IT and operating teams need shared definitions, record responsibility and clear receiving decisions.", "caseLabel": "Supplier Systems", "s1h": "Start with one production record", "s1p1": "Choose one record that planning or quality teams need. Identify its meaning, update timing and production scope.", "s1p2": "Record which team and system maintains it, who checks differences and who confirms the handoff.", "s2h": "Separate enterprise and production responsibilities", "s2p1": "ERP supports enterprise orders, materials, planning and costs. Manufacturing execution solutions support production progress, lot records and quality information.", "s2p2": "Use these roles to discuss record responsibility and process needs. Define the technical scope with the factory teams before selecting a handoff approach.", "s3h": "Industry context: Wafer Works", "s3p1": "Wafer Works / 合晶科技 in Taiwan / Shanghai produces silicon wafer materials through crystal growth, wafer processing and epitaxy.", "s3p2": "The case connects silicon crystals to wafer-lot production history and provides visibility into progress, equipment status and epitaxy records with quality parameter limits.", "s3p3": "These production-information topics help factory teams identify the records and responsibilities to discuss in their own processes.", "s4h": "Define the local factory scope", "s4p1": "Digiwin Vietnam assesses factory operations, advises on business processes and supports on-site solution transfer and factory acceptance.", "s4p2": "Bring one current information handoff, its record owner, receiving decision and unresolved differences to a discussion of your process and implementation scope.", "src1": "Digiwin semiconductor solutions: Wafer Works", "src2": "Digiwin Vietnam: supplier solutions and local services"}, "zh-Hans": {"edition": "制造业数字化方案", "back": "返回内容流程", "skip": "跳至案例正文", "langLabel": "语言", "articleLabel": "系统交接前，先明确记录归属", "contextIndex": "企业背景", "contextTitle": "让记录与业务流程相互衔接", "contextBody": "根据Digiwin越南发布的案例，中国江苏中科智 ses need to work together", "contextBody": "According to the case published by Digiwin Vietnam, 江苏中科智芯集成科技有限公司 in China implemented an integrated ERP + iMES solution. The published problems include disorganized records, nonstandard processes and low outsourcing and production efficiency.", "mechanismIndex": "Inside the case", "mechanismTitle": "How the implementation connects information", "mechanismLead": "The published mechanisms span shopfloor data, production records, parameter changes and exception handling within the integrated solution.", "valueIndex": "Review your current setup", "valueTitle": "Use three questions to prepare the next handoff", "valueLead": "Bring Operations and Quality into the same discussion about comparison scope, source records and confirmation responsibilities.", "v1Title": "Compare the same lot, stage and recording time", "v1Body": "Do the reports describe the same process stage and recording time? Different status reports may both be correct when their context differs.", "v1Prepare": "Prepare two status reports for one lot, with the stage and recording time of each.", "v2Title": "Identify the record that supports the handoff", "v2Body": "Which source record supports the next step, and what information does the receiving team need?", "v2Prepare": "Prepare the source record for one handoff and the receiving team’s information requirements.", "v3Title": "Make the confirmation owner and next check clear", "v3Body": "Who checks missing information and its source, and who confirms the next step before the receiving team updates lot status?", "v3Prepare": "Prepare the confirmation roles and one example of missing information in a lot handoff.", "prepare": "Information to prepare", "bridge": "A shared view of lot context, source records and responsibilities can help teams identify where a handoff needs attention. Start the discussion with one actual handoff at your company.", "consultLabel": "Talk with Digiwin Vietnam", "consultTitle": "Bring one lot-handoff workflow to the discussion", "consultBody": "Describe how Operations and Quality compare status reports, confirm the source record and assign the next check. We provide digital solutions for manufacturing, from ERP to smart manufacturing.", "next": "The next step opens Digiwin Vietnam’s consultation request page in Vietnamese.", "cta": "Discuss lot records and handoff responsibilities", "sourceLabel": "Reference source", "sourceLink": "Read the Chinese case collection", "sourceHint": "In the source, select 封装测试, then 案例 06 江苏中科智芯集成科技有限公司.", "sourceLang": "Source: Simplified Chinese · this page summarizes the named case.", "footer": "Digiwin Vietnam · Enterprise management solutions", "market": "Industry context · Taiwan / Shanghai", "figure": "Illustration made for this page: silicon crystal, wafers, epitaxy and production records. Not a photo of Wafer Works or its equipment.", "figureAlt": "Illustration of a silicon crystal, a stack of wafers and an epitaxy chamber linked by data lines to a stack of record sheets and a range indicator.", "s1Index": "Where to start", "s2Index": "Roles and responsibilities", "s3Index": "Industry context", "title": "Scope the customer question before collecting records", "lead": "For PCB suppliers serving semiconductor and electronics equipment, quality and operating teams need clear record scope, sources and review responsibility.", "caseLabel": "Supplier Quality", "s1h": "Define the customer question", "s1p1": "Identify the lot, process step, time period and information requested. Use this scope to decide which records matter to the response.", "s1p2": "Name who compares those records with the request, who resolves differences and who confirms the response.", "s2h": "Separate enterprise and production records", "s2p1": "ERP supports enterprise orders, materials, planning and costs. Manufacturing execution solutions support production progress, lot records and quality information.", "s2p2": "Identify the team or syst   };
  
  const PHOTO_MAP = {"O1": "osat", "O2": "osat", "O3": "osat", "O4-O": "osat", "O4-Q": "osat", "F1": "fabless", "F2": "fabless", "F3": "fabless", "P1": "partner", "P2": "partner", "P3": "partner"};
  const COPIES = JSON.parse(document.getElementById('all-copies').textContent);
  const O2_ENTRIES = JSON.parse(document.getElementById('o2-entry-copies').textContent);
  const VALID_TREATMENTS = Object.keys(COPIES);
  const VALID_LOCALES = ['vi', 'en', 'zh-Hans', 'zh-Hant'];

  let currentTreatment = 'O1';
  let currentLocale = 'en';
  let currentEntry = null;

  function resolveEntry(treatment, locale, entry) {
    if (treatment !== 'O2') return null;
    if (Object.hasOwn(O2_ENTRIES, entry)) return entry;
    return locale === 'zh-Hant' ? 'B6' : locale === 'zh-Hans' ? 'B5' : 'B4';
  }

  // 2. Parse URL and UTM params
  function resolveRoute() {
    const url = new URL(window.location.href);
    let t = (url.searchParams.get('t') || url.searchParams.get('treatment') || '').trim();
    let lang = (url.searchParams.get('lang') || url.searchParams.get('locale') || '').trim();
    const utmCampaign = (url.searchParams.get('utm_campaign') || '').toLowerCase();
    const utmContent = (url.searchParams.get('utm_content') || '').toLowerCase();
    const combinedUTM = utmCampaign + ' ' + utmContent;

    // Normalization map
    const aliasMap = {
      'o1': 'O1', 'o2': 'O2', 'o3': 'O3', 'o4-o': 'O4-O', 'o4o': 'O4-O',
      'o4-q': 'O4-Q', 'o4q': 'O4-Q',
      'f1': 'F1', 'f2': 'F2', 'f3': 'F3',
      'p1': 'P1', 'p2': 'P2', 'p3': 'P3'
    };

    // Deducing treatment if not explicit
    if (!t || !aliasMap[t.toLowerCase()]) {
      for (const [alias, realT] of Object.entries(aliasMap)) {
        const regex = new RegExp('(?:^|[^a-z0-9])' + alias + '(?:[^a-z0-9]|$)', 'i');
        if (regex.test(combinedUTM)) {
          t = realT;
          break;
        }
      }
    } else {
      t = aliasMap[t.toLowerCase()];
    }

    // Deducing language if not explicit
    if (!lang || !VALID_LOCALES.includes(lang)) {
      if (combinedUTM.includes('zh-hant') || combinedUTM.includes('hant') || combinedUTM.includes('traditional')) {
        lang = 'zh-Hant';
      } else if (combinedUTM.includes('zh-hans') || combinedUTM.includes('hans') || combinedUTM.includes('simplified') || combinedUTM.includes('_zh_')) {
        lang = 'zh-Hans';
      } else if (combinedUTM.includes('_en_') || combinedUTM.includes('english')) {
        lang = 'en';
      } else if (combinedUTM.includes('_vi_') || combinedUTM.includes('vietnam') || combinedUTM.includes('vietnamese')) {
        lang = 'vi';
      }
    }

    // Fallbacks
    if (!t || !VALID_TREATMENTS.includes(t)) t = 'O1';
    if (!lang || !VALID_LOCALES.includes(lang)) lang = 'en';

    return { treatment: t, locale: lang, entry: resolveEntry(t, lang, url.searchParams.get('entry')) };
  }

  // 3. Render function
  function render(treatment, locale, persist, entry) {
    if (!VALID_TREATMENTS.includes(treatment)) treatment = 'O1';
    if (!VALID_LOCALES.includes(locale)) locale = 'en';

    currentTreatment = treatment;
    currentLocale = locale;
    currentEntry = resolveEntry(treatment, locale, entry);

    const tpl = document.getElementById('tpl-' + treatment);
    const container = document.getElementById('app-main');
    if (!tpl || !container) return;

    // Inject template DOM
    container.innerHTML = tpl.innerHTML;

    // Set Photo
    const photoKey = PHOTO_MAP[treatment] || 'osat';
    const photoEl = container.querySelector('.case-photo');
    if (photoEl && PHOTOS[photoKey]) {
      photoEl.src = PHOTOS[photoKey];
    }

    // Apply copy
    const copy = (currentEntry ? O2_ENTRIES[currentEntry] : COPIES[treatment])[locale];
    if (copy) {
      container.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (copy[key] !== undefined) {
          el.textContent = copy[key];
        }
      });
      container.querySelectorAll('[data-i18n-attr]').forEach(el => {
        const [attr, key] = el.dataset.i18nAttr.split(':');
        if (copy[key] !== undefined) {
          el.setAttribute(attr, copy[key]);
        }
      });
      
      // The language bar sits outside the template and must localize too.
      if (copy.langLabel) document.querySelector('.language-bar').setAttribute('aria-label', copy.langLabel);

      // Header edition
      document.querySelectorAll('[data-i18n="edition"]').forEach(el => {
        if (copy.edition) el.textContent = copy.edition;
      });
      // Skip link
      document.querySelectorAll('[data-i18n="skip"]').forEach(el => {
        if (copy.skip) el.textContent = copy.skip;
      });

      document.title = (copy.title ? copy.title + ' | ' : '') + 'Digiwin';
    }

    // Approved P1/P2 English consultation handoff.
    if ((treatment === 'P1' || treatment === 'P2') && locale === 'en') {
      const consult = container.querySelector('.consult-inner');
      if (consult) {
        const notice = document.createElement('p');
        notice.id = 'partner-contact-language';
        notice.textContent = 'Opens Digiwin Vietnam’s consultation page in Vietnamese.';
        const contact = document.createElement('a');
        contact.id = 'partner-contact-cta';
        contact.className = 'cta';
        contact.href = 'https://www.digiwin.com.vn/contact-vn/';
        contact.setAttribute('aria-describedby', notice.id);
        contact.textContent = 'Discuss your factory workflow';
        consult.append(notice, contact);
      }
    }

    document.documentElement.lang = locale;

    // Update language bar buttons
    document.querySelectorAll('.language-bar button').forEach(btn => {
      btn.setAttribute('aria-pressed', String(btn.dataset.locale === locale));
    });

    // Persist URL state without reloading
    if (persist) {
      const url = new URL(location.href);
      url.searchParams.set('t', treatment);
      url.searchParams.set('lang', locale);
      if (currentEntry) url.searchParams.set('entry', currentEntry);
      else url.searchParams.delete('entry');
      history.replaceState(null, '', url);
    }

    document.documentElement.classList.remove('i18n-pending');
  }

  // 4. Initial route resolution
  const initial = resolveRoute();
  render(initial.treatment, initial.locale, false, initial.entry);

  // 5. Language toggle interaction
  const picker = document.querySelector('.language-bar');
  if (picker) {
    picker.addEventListener('click', event => {
      const button = event.target.closest('button[data-locale]');
      if (!button || !picker.contains(button)) return;
      const top = scrollY;
      render(currentTreatment, button.dataset.locale, true, currentEntry);
      scrollTo({ top, behavior: 'instant' });
      button.focus({ preventScroll: true });
    });
  }

  // Expose router to window for testing / manual inspection
  window.unifiedReader = {
    render: render,
    getTreatment: () => currentTreatment,
    getLocale: () => currentLocale,
    getEntry: () => currentEntry,
    validTreatments: VALID_TREATMENTS,
    validLocales: VALID_LOCALES
  };
})();
</script>
</body>
</html>
